services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: silla_isiah_james_act4_php
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_FPM_PM=dynamic
      - PHP_FPM_PM_MAX_CHILDREN=10
      - PHP_ENV=docker
    networks:
      - silla_isiah_james_act4_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: silla_isiah_james_act4_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - silla_isiah_james_act4_network
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: silla_isiah_james_act4_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: silla_isiah_james_act4_db
      MYSQL_USER: silla_isiah_james_act4_user
      MYSQL_PASSWORD: silla_isiah_james_act4_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - silla_isiah_james_act4_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: silla_isiah_james_act4_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      PMA_DB_ENGINE: mysql
    networks:
      - silla_isiah_james_act4_network
    depends_on:
      - mysql

  # Tailwind CSS asset pipeline (Vite).
  # Dev: runs the Vite dev server with hot module reload at http://localhost:5173
  # Prod: don't run this service — instead `npm run build` (locally or in CI)
  #       to produce public/build, which nginx then serves as static files.
  node:
    image: node:20-alpine
    container_name: silla_isiah_james_act4_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - silla_isiah_james_act4_network
    environment:
      - CHOKIDAR_USEPOLLING=true

networks:
  silla_isiah_james_act4_network:
    driver: bridge

volumes:
  mysql_data:
  node_modules:
