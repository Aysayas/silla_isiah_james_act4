server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html index.htm;
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main location
    location / {
        try_files $uri $uri/ @lavalust;
    }

    # Rewrite clean URLs (e.g. /about) into /index.php/about so
    # LavaLust's PHP_SELF-based router can see the requested path.
    location @lavalust {
        rewrite ^/(.*)$ /index.php/$1 last;
    }

    # PHP handler
    # NOTE: this file is for LOCAL docker-compose only, where nginx and php
    # are separate containers on the "lavalust_network" - "php" resolves via
    # Docker's DNS to the php-fpm container. The single-container Render
    # build uses docker/nginx/nginx.render.conf instead (127.0.0.1, since
    # nginx and php-fpm share one container there via supervisord).
    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 404 /index.php;
}
